<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0d1512" />
    <meta name="description" content="Mycelium — réseau social léger" />
    <title>Mycelium</title>
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
    <link rel="stylesheet" href="/css/style.css" />
</head>

<body>




    <!-- ====== AUTH SCREEN ====== -->
    <div id="screen-auth" class="screen active">
        <div class="auth-container">
            <svg class="brand-mark" aria-hidden="true" focusable="false" viewBox="0 0 64 64" fill="none"
                stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
                <path
                    d="M32 6c-5.6 0-9.4 3.3-10.4 7.2C17 14 14 17.5 14 21.6c0 4.3 3.2 7.8 7.4 8.3M32 6c5.6 0 9.4 3.3 10.4 7.2C47 14 50 17.5 50 21.6c0 4.3-3.2 7.8-7.4 8.3" />
                <path d="M21.4 29.9c1.6 3.1 5.5 5.1 10.6 5.1s9-2 10.6-5.1" />
                <path d="M32 14v26" />
                <path d="M32 22l-5-4M32 27l5-4" />
                <path d="M32 40v18" />
                <path d="M32 42c-4 2-6 5-7 9s-2.5 6-5 7M32 42c4 2 6 5 7 9s2.5 6 5 7" />
                <path d="M32 48c-2.6 1.6-4 4-4.6 7M32 48c2.6 1.6 4 4 4.6 7" />
            </svg>
            <h1 class="logo">Mycelium</h1>
            <p class="tagline">Connectés par les racines.</p>


            <div class="tabs">
                <button class="tab active" data-tab="login">Connexion</button>
                <button class="tab" data-tab="register">Inscription</button>
            </div>

            <!-- Login -->
            <form id="form-login" class="auth-form">
                <input type="text" id="login-id" placeholder="Nom d'utilisateur ou email" autocomplete="username"
                    required />
                <input type="password" id="login-pw" placeholder="Mot de passe" autocomplete="current-password"
                    required />
                <div id="login-error" class="error-msg hidden"></div>
                <button type="submit" class="btn-primary">Se connecter</button>
            </form>

            <!-- Register -->
            <form id="form-register" class="auth-form hidden">
                <input type="text" id="reg-username" placeholder="Nom d'utilisateur (lettres, chiffres, _)"
                    maxlength="30" required />
                <input type="text" id="reg-display" placeholder="Nom affiché" maxlength="60" required />
                <input type="email" id="reg-email" placeholder="Email" required />
                <input type="password" id="reg-pw" placeholder="Mot de passe (min 8 car.)" minlength="8" required />
                <div id="register-error" class="error-msg hidden"></div>
                <button type="submit" class="btn-primary">Créer mon compte</button>
            </form>
        </div>
    </div>

    <!-- ====== MAIN APP ====== -->
    <div id="screen-app" class="screen hidden">

        <!-- Nav bottom (mobile-first) -->
        <nav class="bottom-nav">
            <div class="nav-brand" aria-hidden="true">
                <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"
                    stroke-linejoin="round">
                    <path
                        d="M32 6c-5.6 0-9.4 3.3-10.4 7.2C17 14 14 17.5 14 21.6c0 4.3 3.2 7.8 7.4 8.3M32 6c5.6 0 9.4 3.3 10.4 7.2C47 14 50 17.5 50 21.6c0 4.3-3.2 7.8-7.4 8.3" />
                    <path d="M21.4 29.9c1.6 3.1 5.5 5.1 10.6 5.1s9-2 10.6-5.1" />
                    <path d="M32 14v26" />
                    <path d="M32 22l-5-4M32 27l5-4" />
                    <path d="M32 40v18" />
                    <path d="M32 42c-4 2-6 5-7 9s-2.5 6-5 7M32 42c4 2 6 5 7 9s2.5 6 5 7" />
                    <path d="M32 48c-2.6 1.6-4 4-4.6 7M32 48c2.6 1.6 4 4 4.6 7" />
                </svg>
                <b>Mycelium</b>
            </div>

            <button class="nav-btn active" data-view="feed" aria-label="Fil d'actu">
                <svg viewBox="0 0 24 24">
                    <path d="M3 12l9-9 9 9M5 10v9a1 1 0 001 1h4v-5h4v5h4a1 1 0 001-1v-9" />
                </svg>
                <span>Accueil</span>
            </button>
            <button class="nav-btn" data-view="search" aria-label="Rechercher">
                <svg viewBox="0 0 24 24">
                    <circle cx="11" cy="11" r="8" />
                    <line x1="21" y1="21" x2="16.65" y2="16.65" />
                </svg>
                <span>Recherche</span>
            </button>
            <button class="nav-btn" id="nav-compose" aria-label="Publier">
                <svg viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="10" />
                    <line x1="12" y1="8" x2="12" y2="16" />
                    <line x1="8" y1="12" x2="16" y2="12" />
                </svg>
                <span>Publier</span>
            </button>
            <button class="nav-btn" data-view="profile-me" aria-label="Profil">
                <svg viewBox="0 0 24 24">
                    <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2" />
                    <circle cx="12" cy="7" r="4" />
                </svg>
                <span>Profil</span>
            </button>
            <button class="nav-btn" id="nav-logout" aria-label="Déconnexion">
                <svg viewBox="0 0 24 24">
                    <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4" />
                    <polyline points="16 17 21 12 16 7" />
                    <line x1="21" y1="12" x2="9" y2="12" />
                </svg>
                <span>Déconnexion</span>
            </button>
            <button class="nav-btn" id="nav-theme" aria-label="Changer le thème">
                <svg viewBox="0 0 24 24" class="theme-icon-sun">
                    <circle cx="12" cy="12" r="5" />
                    <line x1="12" y1="1" x2="12" y2="3" />
                    <line x1="12" y1="21" x2="12" y2="23" />
                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
                    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
                    <line x1="1" y1="12" x2="3" y2="12" />
                    <line x1="21" y1="12" x2="23" y2="12" />
                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
                    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
                </svg>
                <svg viewBox="0 0 24 24" class="theme-icon-moon hidden">
                    <path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z" />
                </svg>
                <span>Thème</span>
            </button>
        </nav>

        <!-- Views -->
        <main class="main-content">

            <!-- Feed view -->
            <div id="view-feed" class="view active">
                <header class="view-header">
                    <svg class="header-mark" aria-hidden="true" focusable="false" viewBox="0 0 64 64" fill="none"
                        stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
                        <path
                            d="M32 6c-5.6 0-9.4 3.3-10.4 7.2C17 14 14 17.5 14 21.6c0 4.3 3.2 7.8 7.4 8.3M32 6c5.6 0 9.4 3.3 10.4 7.2C47 14 50 17.5 50 21.6c0 4.3-3.2 7.8-7.4 8.3" />
                        <path d="M21.4 29.9c1.6 3.1 5.5 5.1 10.6 5.1s9-2 10.6-5.1" />
                        <path d="M32 14v26" />
                        <path d="M32 22l-5-4M32 27l5-4" />
                        <path d="M32 40v18" />
                        <path d="M32 42c-4 2-6 5-7 9s-2.5 6-5 7M32 42c4 2 6 5 7 9s2.5 6 5 7" />
                        <path d="M32 48c-2.6 1.6-4 4-4.6 7M32 48c2.6 1.6 4 4 4.6 7" />
                    </svg>
                    <h2>Fil d'actualité</h2>
                </header>

                <div id="feed-list" class="post-list">
                    <div class="loading">Chargement…</div>
                </div>
            </div>

            <!-- Search view -->
            <div id="view-search" class="view hidden">
                <header class="view-header">
                    <h2>Recherche</h2>
                </header>
                <div class="search-bar">
                    <input type="search" id="search-input" placeholder="Chercher un utilisateur…" />
                    <button id="search-btn" class="btn-secondary">Go</button>
                </div>
                <div id="search-results" class="user-list"></div>
            </div>

            <!-- Profile view -->
            <div id="view-profile" class="view hidden">
                <header class="view-header back-header">
                    <button id="back-btn" class="icon-btn">
                        <svg viewBox="0 0 24 24">
                            <polyline points="15 18 9 12 15 6" />
                        </svg>
                    </button>
                    <h2 id="profile-title">Profil</h2>
                </header>
                <div id="profile-card" class="profile-card"></div>
                <div id="profile-posts" class="post-list"></div>
            </div>

        </main>

        <!-- Compose modal -->
        <div id="modal-compose" class="modal hidden" role="dialog" aria-modal="true" aria-label="Nouveau post">
            <div class="modal-backdrop"></div>
            <div class="modal-box">
                <div class="modal-header">
                    <button id="close-compose" class="icon-btn" aria-label="Fermer">
                        <svg viewBox="0 0 24 24">
                            <line x1="18" y1="6" x2="6" y2="18" />
                            <line x1="6" y1="6" x2="18" y2="18" />
                        </svg>
                    </button>
                    <h3>Nouveau post</h3>
                </div>
                <textarea id="compose-text" maxlength="280" placeholder="Quoi de neuf ?"></textarea>
                <div class="compose-footer">
                    <span id="compose-count">280</span>
                    <button id="compose-submit" class="btn-primary">Publier</button>
                </div>
                <div id="compose-error" class="error-msg hidden"></div>
            </div>
        </div>

    </div><!-- /screen-app -->

    <script src="/js/api.js"></script>
    <script src="/js/app.js"></script>
</body>

</html>
