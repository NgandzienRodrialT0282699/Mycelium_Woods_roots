version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: mycelium-woods-roots-db
    environment:
      POSTGRES_USER: mycelium
      POSTGRES_PASSWORD: mycelium_secret
      POSTGRES_DB: mycelium_woods_roots_db
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/src/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mycelium -d mycelium_woods_roots_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
    container_name: mycelium-woods-roots-backend
    environment:
      DATABASE_URL: postgres://mycelium:mycelium_secret@db:5432/mycelium_woods_roots_db
      JWT_SECRET: change_me_in_production
      PORT: 3000
    volumes:
      - ./backend:/app
    working_dir: /app
    command: sh -c "npm install && node src/index.js"
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
    container_name: mycelium-woods-roots-frontend
    volumes:
      - ./frontend:/usr/share/nginx/html
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped 

volumes:
  pgdata:
